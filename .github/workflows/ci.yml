# CI de ADR 014: nada entra a `main` sin estas verificaciones en verde (principio 2).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # Este nombre es el que exige la protección de `main` (T13).
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      # Mismas imágenes que docker-compose.yml.
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: liga_dev
          # Base temporal del job, sin credenciales (principio 5).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d liga_dev"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 8025:8025
          - 1025:1025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/liga_dev
      INTEGRATION_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/liga_integration
      E2E_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/liga_e2e

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar pnpm (versión de packageManager)
        uses: pnpm/action-setup@v6

      - name: Instalar Node (versión de .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias y generar el cliente de Prisma
        run: pnpm install --frozen-lockfile

      - name: Formato
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tipos
        run: pnpm typecheck

      - name: Tests unitarios
        run: pnpm test

      - name: Tests de integración (migran liga_integration)
        run: pnpm test:integration

      - name: Build de producción
        run: pnpm build

      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Caché de Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Instalar Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Instalar dependencias de sistema de Chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Tests E2E (migran liga_e2e y corren contra el build de producción)
        run: pnpm test:e2e

      - name: Subir el reporte de Playwright si algo falló
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
